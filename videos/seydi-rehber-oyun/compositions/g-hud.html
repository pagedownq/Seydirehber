<!doctype html>
<html lang="tr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "PressStart"; src: url("assets/fonts/PressStart2P-Regular.ttf"); }
        #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        #hd-bar { position: absolute; left: 60px; right: 60px; top: 110px; height: 124px; display: flex; align-items: center; gap: 28px; padding: 0 30px; background: rgba(10,8,32,0.88); border: 6px solid #29e6ff; box-shadow: 8px 8px 0 #ff4fa3; font-family: "PressStart"; color: #fff; }
        #hd-lv { width: 190px; height: 40px; position: relative; font-size: 34px; color: #4caf50; }
        #hd-lv div { position: absolute; left: 0; top: 0; white-space: nowrap; }
        #hd-xp-l { font-size: 22px; color: #9b8fd6; }
        #hd-xp { position: relative; flex: 1; height: 38px; border: 5px solid #fff; background: #1a1240; }
        #hd-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, #4caf50, #b9f6ca); transform-origin: 0 50%; }
        #hd-coin { width: 46px; height: 46px; border-radius: 50%; background: #ffc107; border: 6px solid #fff3c4; }
        #hd-cnt { width: 150px; font-size: 32px; color: #ffc107; }
      </style>

      <div data-hf-id="hf-1hbg" id="root" data-composition-id="g-hud" data-width="1080" data-height="1920">
        <div data-hf-id="hf-aexl" id="hd-bar">
          <div data-hf-id="hf-bqvg" id="hd-lv"><div data-hf-id="hf-bmw7" id="hd-lv-1">LV 1</div><div data-hf-id="hf-8d9t" id="hd-lv-99">LV 99</div></div>
          <div data-hf-id="hf-ekgp" id="hd-xp-l">XP</div>
          <div data-hf-id="hf-k72e" id="hd-xp"><div data-hf-id="hf-uvmd" id="hd-fill"></div></div>
          <div data-hf-id="hf-2dgp" id="hd-coin"></div>
          <div data-hf-id="hf-28xn" id="hd-cnt">0000</div>
        </div>
      </div>

      <script>
        // Zamanlar global zaman − 8,5 (HUD 8,5 sn'de başlar).
        const tl = gsap.timeline({ paused: true });
        const cnt = document.getElementById("hd-cnt");
        const pad = (n) => String(Math.round(n)).padStart(4, "0");
        gsap.set("#hd-fill", { scaleX: 0 });
        gsap.set("#hd-lv-99", { opacity: 0 });
        tl.fromTo("#hd-bar", { y: -260 }, { y: 0, duration: 0.3, ease: "back.out(1.6)" }, 0.05);

        // Coin sayacı zamanın fonksiyonu: tek tween bütün HUD süresini kapsar (her seek doğru değeri yazar).
        const COIN_EVENTS = [];
        function coins(from, to, at, dur) {
          COIN_EVENTS.push({ from, to, at, dur });
          tl.to("#hd-coin", { keyframes: [{ scale: 1.4 }, { scale: 1 }], duration: 0.2, ease: "power2.out" }, at);
        }
        function coinValue(t) {
          let v = 0;
          COIN_EVENTS.forEach((e) => {
            if (t >= e.at) v = t >= e.at + e.dur ? e.to : e.from + ((e.to - e.from) * (t - e.at)) / e.dur;
          });
          return v;
        }
        function xp(to, at, dur) {
          tl.to("#hd-fill", { scaleX: to, duration: dur, ease: "power2.out" }, at);
        }
        // Görev 1 (global 13,6) ve coinler (≈14,2)
        xp(0.35, 5.1, 0.8);
        coins(0, 500, 5.6, 0.8);
        // Görev 2 (global 20,8) ve coinler (≈21,4)
        xp(0.6, 12.3, 0.6);
        coins(500, 900, 12.9, 0.6);
        // Bonus: 8 kart, her damga global 24,32 + i×1,1
        for (let i = 0; i < 8; i++) {
          const at = 15.82 + i * 1.1;
          xp(0.6 + (i + 1) * 0.05, at, 0.25);
          coins(900 + i * 100, 1000 + i * 100, at, 0.25);
        }
        // Seviye atlama (global 32,6); LV 99 sahne sayacı 99a vardığında (global 34,0)
        tl.fromTo("#hd-fill", { filter: "brightness(1)" }, { keyframes: [{ filter: "brightness(2)" }, { filter: "brightness(1)" }], duration: 0.4 }, 24.1);
        tl.set("#hd-lv-1", { opacity: 0 }, 25.5);
        tl.set("#hd-lv-99", { opacity: 1 }, 25.5);
        tl.fromTo("#hd-lv", { scale: 1 }, { keyframes: [{ scale: 1.4 }, { scale: 1 }], duration: 0.3 }, 25.5);
        tl.to("#hd-bar", { y: -260, duration: 0.25, ease: "power3.in" }, 28.7);
        const clock = { t: 0 };
        tl.fromTo(clock, { t: 0 }, { t: 29, duration: 29, ease: "none", onUpdate: () => { cnt.textContent = pad(coinValue(clock.t)); } }, 0);
        gsap.set("#hd-coin", { scale: 1 });
        window.__timelines["g-hud"] = tl;
      </script>
    </template>
  </body>
</html>
