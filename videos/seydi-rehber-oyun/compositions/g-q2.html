<!doctype html>

  <body>
    <template>
      <style>
        @font-face { font-family: "PressStart"; src: url("assets/fonts/PressStart2P-Regular.ttf"); }
        @font-face { font-family: "Poppins"; font-weight: 600; src: url("assets/fonts/Poppins_600SemiBold.ttf"); }
        @font-face { font-family: "Poppins"; font-weight: 800; src: url("assets/fonts/Poppins_800ExtraBold.ttf"); }
        @font-face { font-family: "Material Icons"; src: url("assets/fonts/MaterialIcons.ttf"); }
        #root { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Poppins", sans-serif; }
        #q2-bg { position: absolute; inset: 0; background: linear-gradient(180deg, #071a24 0%, #0b2f35 55%, #061214 100%); }
        #q2-scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 3px, rgba(0,0,0,0) 3px, rgba(0,0,0,0) 7px); }
        #q2-card { position: absolute; left: 90px; right: 90px; top: 560px; padding: 60px 50px; text-align: center; background: #00897b; border: 10px solid #fff; box-shadow: 16px 16px 0 #000; }
        #q2-tag { font-family: "PressStart"; font-size: 40px; color: #b2fff4; }
        #q2-t1 { margin-top: 36px; font-weight: 800; font-size: 96px; line-height: 1.05; }
        #q2-diff { margin-top: 34px; display: flex; justify-content: center; align-items: center; gap: 16px; font-family: "PressStart"; font-size: 28px; }
        #q2-diff i { font-style: normal; font-family: "Material Icons"; font-size: 54px; color: #b2fff4; }
        #q2-banner { position: absolute; left: 90px; right: 90px; top: 290px; height: 92px; display: flex; align-items: center; justify-content: center; gap: 18px; background: #00897b; border: 6px solid #fff; font-weight: 800; font-size: 40px; }
        #q2-banner span { font-family: "PressStart"; font-size: 24px; color: #b2fff4; }

        /* Koşu şeridi */
        #q2-road { position: absolute; left: 0; right: 0; top: 1040px; height: 300px; background: #1c2a2e; border-top: 10px solid #4b6b70; border-bottom: 10px solid #4b6b70; }
        #q2-dash { position: absolute; left: -200px; right: -200px; top: 140px; height: 16px; background-image: linear-gradient(90deg, #ffc107 0px, #ffc107 80px, transparent 80px, transparent 160px); background-size: 160px 16px; }
        #q2-bus { position: absolute; left: 0; top: 880px; width: 460px; height: 260px; }
        #q2-bus-body { position: absolute; inset: 0; border-radius: 40px; background: #26a69a; border: 8px solid #fff; display: flex; align-items: center; justify-content: center; font-family: "Material Icons"; font-size: 160px; color: #fff; }
        .q2-wheel { position: absolute; top: 220px; width: 80px; height: 80px; border-radius: 50%; background: #111; border: 10px solid #9e9e9e; }
        #q2-player { position: absolute; left: 0; top: 1100px; width: 64px; height: 64px; border-radius: 50%; background: #29e6ff; box-shadow: 0 0 0 10px rgba(41,230,255,0.25), 0 0 40px #29e6ff; }
        #q2-hurry { position: absolute; left: 0; right: 0; top: 1460px; text-align: center; font-family: "PressStart"; font-size: 70px; color: #ff5252; text-shadow: 6px 6px 0 #5a0000; }

        /* Saat panosu */
        #q2-board { position: absolute; left: 110px; right: 110px; top: 470px; padding: 36px 40px; background: #111; border: 8px solid #ffc107; box-shadow: 12px 12px 0 #000; }
        #q2-board-h { font-family: "PressStart"; font-size: 30px; color: #ffc107; margin-bottom: 26px; }
        .q2-flap { display: flex; gap: 10px; margin-top: 14px; }
        .q2-ch { width: 64px; height: 92px; background: #222; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 60px; color: #fff; border-bottom: 4px solid #000; }

        #q2-pu { position: absolute; left: 400px; top: 640px; width: 280px; height: 280px; }
        #q2-pu-ring { position: absolute; inset: -40px; border-radius: 50%; border: 12px solid #ffc107; }
        #q2-pu img { position: absolute; inset: 0; width: 280px; height: 280px; border-radius: 64px; box-shadow: 0 0 0 8px #fff, 0 0 80px rgba(255,193,7,0.9); }

        #q2-dim { position: absolute; inset: 0; background: rgba(4,14,16,0.84); opacity: 0; }
        #q2-done { position: absolute; left: 60px; right: 60px; top: 640px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        #q2-done-ic { font-family: "Material Icons"; font-size: 200px; color: #4caf50; line-height: 1; }
        #q2-done-t { margin-top: 20px; font-weight: 800; font-size: 108px; line-height: 1; text-shadow: 6px 6px 0 #0a3d12; }
        #q2-xp { margin-top: 50px; font-family: "PressStart"; font-size: 70px; color: #ffc107; text-shadow: 5px 5px 0 #7a4b00; }
        #q2-combo { margin-top: 44px; font-family: "PressStart"; font-size: 64px; color: #ff4fa3; text-shadow: 5px 5px 0 #4a0026; }
        .q2-coin { position: absolute; left: 510px; top: 1300px; width: 60px; height: 60px; border-radius: 50%; background: #ffc107; border: 6px solid #fff3c4; }
        .q2-wipe { position: absolute; top: 0; height: 1920px; width: 136px; background: #000; transform-origin: 50% 100%; }
      </style>

      <div data-hf-id="hf-emr4" id="root" data-composition-id="g-q2" data-width="1080" data-height="1920">
        <div data-hf-id="hf-6pgw" id="q2-bg"></div>
        <div data-hf-id="hf-mhbr" id="q2-road"><div data-hf-id="hf-rgix" id="q2-dash"></div></div>
        <div data-hf-id="hf-a5ot" id="q2-bus"><div data-hf-id="hf-lir6" id="q2-bus-body">&#xe530;</div><div data-hf-id="hf-jrl2" class="q2-wheel" style="left:60px"></div><div data-hf-id="hf-ndfx" class="q2-wheel" style="left:320px"></div></div>
        <div data-hf-id="hf-n7ju" id="q2-player"></div>
        <div data-hf-id="hf-pmar" id="q2-hurry">ACELE ET!</div>
        <div data-hf-id="hf-lhlb" id="q2-board">
          <div data-hf-id="hf-rxgp" id="q2-board-h">OTOBUS SAATLERI</div>
          <div data-hf-id="hf-fo23" class="q2-flap" id="q2-flap-0"></div>
          <div data-hf-id="hf-bpy2" class="q2-flap" id="q2-flap-1"></div>
        </div>
        <div data-hf-id="hf-ycj5" id="q2-banner"><span data-hf-id="hf-slgu">GOREV 2</span>Otobüse yetiş</div>
        <div data-hf-id="hf-qcy0" id="q2-pu"><div data-hf-id="hf-phxv" id="q2-pu-ring"></div><img data-hf-id="hf-ek68" src="assets/icon.png" alt="Seydi Rehber" /></div>
        <div data-hf-id="hf-feit" id="q2-dim"></div>
        <div data-hf-id="hf-xqyt" id="q2-done" data-layout-allow-overlap>
          <div data-hf-id="hf-ip0q" id="q2-done-ic">&#xe86c;</div>
          <div data-hf-id="hf-zmt7" id="q2-done-t">Görev tamam!</div>
          <div data-hf-id="hf-4dpq" id="q2-xp">+400 XP</div>
          <div data-hf-id="hf-cqjt" id="q2-combo">COMBO x2</div>
        </div>
        <div data-hf-id="hf-wkax" id="q2-coins"></div>
        <div data-hf-id="hf-54aj" id="q2-card">
          <div data-hf-id="hf-ssx0" id="q2-tag">GOREV 2</div>
          <div data-hf-id="hf-uevw" id="q2-t1">Sıradaki otobüs kaçta?</div>
          <div data-hf-id="hf-fpnp" id="q2-diff">ZORLUK <i data-hf-id="hf-3oi4">&#xe838;</i><i data-hf-id="hf-sjqc">&#xe838;</i></div>
        </div>
        <div data-hf-id="hf-pcw7" id="q2-wipes"></div>
        <div data-hf-id="hf-3lca" id="q2-scan"></div>
      </div>

      <script>
        const LINES = ["SAAT SAAT", "HAT HAT"];
        LINES.forEach((line, r) => {
          const el = document.getElementById("q2-flap-" + r);
          for (let i = 0; i < 9; i++) {
            const c = line[i] || " ";
            el.insertAdjacentHTML("beforeend", '<div class="q2-ch" id="q2-ch-' + r + "-" + i + '">' + (c === " " ? "&nbsp;" : c) + "</div>");
          }
        });
        const coins = document.getElementById("q2-coins");
        for (let i = 0; i < 6; i++) coins.insertAdjacentHTML("beforeend", '<div class="q2-coin" id="q2-coin-' + i + '"></div>');
        const wipes = document.getElementById("q2-wipes");
        for (let i = 0; i < 8; i++) wipes.insertAdjacentHTML("beforeend", '<div class="q2-wipe" id="q2-wipe-' + i + '" style="left:' + i * 135 + 'px"></div>');

        const tl = gsap.timeline({ paused: true });
        gsap.set("#q2-banner, #q2-road, #q2-bus, #q2-player, #q2-hurry, #q2-board, #q2-pu, #q2-done, .q2-coin", { opacity: 0 });
        gsap.set(".q2-wipe", { scaleY: 1 });

        // Önceki sahnenin silmesi açılır
        for (let i = 0; i < 8; i++) tl.to("#q2-wipe-" + i, { scaleY: 0, duration: 0.2, ease: "power2.out" }, i * 0.03);

        // 0–1.6: kart
        tl.fromTo("#q2-card", { scale: 1.7, opacity: 0, rotation: 4 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.24, ease: "power4.in" }, 0.05);
        tl.fromTo("#q2-card", { x: 0 }, { keyframes: [{ x: 14 }, { x: -10 }, { x: 5 }, { x: 0 }], duration: 0.2, ease: "none" }, 0.29);
        tl.fromTo("#q2-diff i", { scale: 0 }, { scale: 1, duration: 0.2, ease: "back.out(3)", stagger: 0.1 }, 0.7);
        tl.fromTo("#q2-card", { y: 0 }, { y: -12, duration: 1.0, ease: "sine.inOut" }, 0.5);
        tl.to("#q2-card", { scale: 0.3, y: -420, opacity: 0, duration: 0.25, ease: "power3.in" }, 1.5);
        tl.fromTo("#q2-banner", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.2, ease: "back.out(2)" }, 1.7);

        // 1.6–3.2: otobüs kaçıyor
        tl.set("#q2-road, #q2-bus, #q2-player", { opacity: 1 }, 1.6);
        tl.fromTo("#q2-road", { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: "power3.out" }, 1.6);
        tl.fromTo("#q2-dash", { x: 0 }, { x: -640, duration: 1.6, ease: "none" }, 1.6);
        tl.fromTo("#q2-bus", { x: 1100 }, { x: 330, duration: 0.6, ease: "power2.out" }, 1.65);
        tl.to("#q2-bus", { x: -520, duration: 1.0, ease: "power2.in" }, 2.25);
        tl.fromTo("#q2-player", { x: 1100 }, { x: 160, duration: 1.4, ease: "power1.out" }, 1.75);
        tl.fromTo("#q2-player", { y: 0 }, { keyframes: [{ y: -40 }, { y: 0 }, { y: -40 }, { y: 0 }, { y: -40 }, { y: 0 }], duration: 1.4, ease: "none" }, 1.75);
        tl.set("#q2-hurry", { opacity: 1 }, 1.95);
        tl.fromTo("#q2-hurry", { x: 0 }, { keyframes: [{ x: -12 }, { x: 12 }, { x: -12 }, { x: 12 }, { x: -12 }, { x: 12 }, { x: 0 }], duration: 1.2, ease: "none" }, 1.95);
        tl.to("#q2-hurry", { opacity: 0, duration: 0.1 }, 3.15);

        // 3.2: POWER UP → saat panosu
        tl.set("#q2-pu", { opacity: 1 }, 3.2);
        tl.fromTo("#q2-pu", { y: -1100, rotation: 200, scale: 0.6 }, { opacity: 1, y: 0, rotation: 0, scale: 1, duration: 0.38, ease: "power3.in" }, 3.2);
        tl.fromTo("#q2-pu-ring", { scale: 0.6, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 0.5, ease: "power2.out" }, 3.58);
        tl.to("#q2-pu", { opacity: 0, scale: 0.3, duration: 0.18, ease: "power2.in" }, 3.75);
        tl.set("#q2-board", { opacity: 1 }, 3.7);
        tl.fromTo("#q2-board", { scaleY: 0.05 }, { scaleY: 1, duration: 0.2, ease: "power3.out" }, 3.7);
        for (let r = 0; r < 2; r++) for (let i = 0; i < 9; i++) {
          tl.fromTo("#q2-ch-" + r + "-" + i, { rotationX: 90 }, { rotationX: 0, duration: 0.14, ease: "power2.out" }, 3.85 + r * 0.25 + i * 0.04);
        }
        // Otobüs geri gelir ve durur, oyuncu biner
        tl.fromTo("#q2-bus", { x: 1100 }, { x: 310, duration: 0.5, ease: "back.out(1.2)" }, 3.75);
        tl.to("#q2-player", { x: 520, duration: 0.5, ease: "power2.inOut" }, 4.4);
        tl.to("#q2-player", { scale: 0, duration: 0.15 }, 4.9);
        tl.to("#q2-bus", { x: 360, duration: 0.25, ease: "power1.inOut", yoyo: true, repeat: 1 }, 4.95);

        // 4.8: görev tamam + combo
        tl.to("#q2-dim", { opacity: 1, duration: 0.2 }, 4.8);
        tl.set("#q2-done", { opacity: 1 }, 4.8);
        tl.fromTo("#q2-done-ic", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2.5)" }, 4.8);
        tl.fromTo("#q2-done-t", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.22, ease: "power4.out" }, 4.9);
        tl.fromTo("#q2-xp", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(3)" }, 5.05);
        tl.fromTo("#q2-combo", { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.in" }, 5.4);
        tl.fromTo("#q2-combo", { rotation: 0 }, { keyframes: [{ rotation: -6 }, { rotation: 6 }, { rotation: 0 }], duration: 0.4, ease: "none" }, 5.6);
        for (let i = 0; i < 6; i++) {
          tl.set("#q2-coin-" + i, { opacity: 1 }, 5.0 + i * 0.07);
          tl.fromTo("#q2-coin-" + i, { x: (i - 2.5) * 70, y: 0, scale: 1 }, { opacity: 1, x: 330, y: -1140, scale: 0.5, duration: 0.6, ease: "power2.in" }, 5.0 + i * 0.07);
          tl.set("#q2-coin-" + i, { opacity: 0 }, 5.6 + i * 0.07);
        }
        for (let i = 0; i < 8; i++) tl.to("#q2-wipe-" + i, { scaleY: 1, duration: 0.2, ease: "power2.in" }, 6.1 + i * 0.03);
        window.__timelines["g-q2"] = tl;
      </script>
    </template>
  </body>
</html>
