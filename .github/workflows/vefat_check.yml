name: Vefat Kontrol ve Bildirim

on:
  schedule:
    - cron: '0 9,13,19 * * *' # Sabah 09:00, Öğle 13:00, Akşam 19:00
  workflow_dispatch: # Manuel tetikleme için

permissions:
  contents: write

jobs:
  check-vefat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd seydirehberim/scripts/vefat_checker
          npm install

      - name: Run vefat checker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd seydirehberim/scripts/vefat_checker
          node index.js

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seydirehberim/scripts/vefat_checker/latest_vefat.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update latest vefat [skip ci]"
          git push
